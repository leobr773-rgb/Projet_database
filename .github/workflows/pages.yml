name: Chiffrement + Déploiement Dashboard Trading

on:
  push:
    branches:
      - main
      - claude/nifty-shannon-0ebox0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  encrypt-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install staticrypt
        run: npm install -g staticrypt

      - name: Chiffrer tous les fichiers HTML
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          for f in $(find . -name "*.html" -not -path "./.git/*"); do
            echo "Chiffrement de $f..."
            staticrypt "$f" \
              -p "$STATICRYPT_PASSWORD" \
              --remember 30 \
              --salt a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4 \
              -d "$(dirname $f)"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
